[graph]
# macOS is the only supported platform (ADR-016). Tauri pulls GTK and friends into
# Cargo.lock for Linux; none of it is built here, so none of it is audited here.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
# Keep transitive unmaintained/unsound advisories visible as warnings; direct
# workspace dependencies with either status fail the check.
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
# The workspace crates are unpublished application components and declare
# publish = false; their license posture is not inherited from dependencies.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
