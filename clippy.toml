# Product and technology names that are not code and must not be wrapped in
# backticks. `".."` keeps clippy's own default list and extends it.
doc-valid-idents = [
    "..",
    "DevPorts",
    "SQLite",
    "macOS",
    "libproc",
    "launchd",
    "OrbStack",
    "Colima",
    "GitHub",
    "TypeScript",
]

# Tests may panic, unwrap and print: a failing assertion IS the point there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true

# Spawning and sleeping are the two calls that make a core hard to test and easy
# to leak processes from. The core never spawns: the CLI replaces its own process
# with `exec`, Docker is reached over its socket and the Docker context is read
# from disk (ADR-025). Tests that must launch processes relax the lint in their
# own header.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "The core does not spawn processes; tests relax this lint in their header." },
    { path = "std::thread::sleep", reason = "Use the injected Clock or condition-based waiting instead of blocking a thread." },
]
