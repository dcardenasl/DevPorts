# Product and technology names that are not code and must not be wrapped in
# backticks. `".."` keeps clippy's own default list and extends it.
doc-valid-idents = [
    "..",
    "DevPorts",
    "SQLite",
    "macOS",
    "libproc",
    "launchd",
    "OrbStack",
    "Colima",
    "GitHub",
    "TypeScript",
    "WebKit",
    "WKWebView",
    "AppKit",
    "NSWindow",
    "SMAppService",
]

# Tests may panic, unwrap and print: a failing assertion IS the point there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true

# Spawning and sleeping are the two calls that make a core hard to test and easy
# to leak processes from. The core never spawns: Docker is reached over its socket
# and the Docker context is read from disk (ADR-025). The CLI (`exec` of the run
# command, `open -g -b`) and the app (`launchctl`) spawn from one module each,
# with a justified `#[allow]`. Tests relax the lint in their own header.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "The core does not spawn processes; the CLI and app do it from one allowed module each." },
    { path = "std::thread::sleep", reason = "Use the injected Clock or condition-based waiting instead of blocking a thread." },
]
