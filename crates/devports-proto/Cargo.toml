[package]
name = "devports-proto"
description = "Wire types of the DevPorts IPC protocol, shared by the CLI and the core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

# Lets the types be exported to TypeScript (`ui/src/bindings.ts`). Off in the CLI.
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }

[features]
specta = ["dep:specta"]

[lints]
workspace = true
