[package]
name = "devports-app"
description = "Menu-bar application shell that hosts the DevPorts core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Opens and closes the panel on a timer so memory can be measured without a human
# at the mouse (tools/spike-measure.sh). Spike only: never part of a release.
spike-autopilot = []
# Shows one notification with an action button after a delay and reports what the
# user does with it (task T0.6, V6). Spike only: never part of a release.
spike-notify = ["dep:tauri-plugin-notification"]

[dependencies]
devports-core.workspace = true
tokio = { version = "1", features = ["time"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = { version = "2", optional = true }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Native window styling that Tauri does not expose. Only `window_style` uses them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSView", "NSColor", "NSResponder", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
