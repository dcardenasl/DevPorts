[package]
name = "devports-app"
description = "Menu-bar application shell that hosts the DevPorts core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
devports-core.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
devports-proto.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Native window styling that Tauri does not expose. Only `window_style` uses them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSView", "NSColor", "NSResponder", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
# System notifications through UNUserNotificationCenter (the notification plugin
# of Tauri wraps NSUserNotification, deprecated since macOS 11).
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSArray", "NSSet", "NSError", "NSObject", "NSBundle", "NSDictionary"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNError"] }

[dev-dependencies]
tempfile = "3"
