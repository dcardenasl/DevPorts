[package]
name = "devports-core"
description = "DevPorts domain logic: discovery, observation, identity, leases and the IPC server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
devports-proto.workspace = true
thiserror = "2"
jiff = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
futures-util = "0.3.34"
sha2 = "0.11.1"
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
getrandom = "0.3"
rustix = { version = "1.1.5", features = ["process"] }
# The TypeScript bindings are generated from the Rust types by a test (`tests/bindings.rs`).
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
specta-typescript = { version = "=0.0.12", optional = true }
specta-serde = { version = "=0.0.12", optional = true }

# The macOS process adapter (`platform::macos`) is the only code that talks to
# libproc and sysinfo, so neither is built anywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[features]
bindings = ["dep:specta", "dep:specta-typescript", "dep:specta-serde", "devports-proto/specta"]

[[test]]
name = "bindings"
required-features = ["bindings"]

[lints]
workspace = true
