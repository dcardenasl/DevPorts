[package]
name = "devports-core"
description = "DevPorts domain logic: discovery, observation, identity, leases and the IPC server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
devports-proto.workspace = true
thiserror = "2"
jiff = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
futures-util = "0.3.34"
sha2 = "0.11.1"
serde_json = "1"

# The macOS process adapter (`platform::macos`) is the only code that talks to
# libproc and sysinfo, so neither is built anywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[lints]
workspace = true
