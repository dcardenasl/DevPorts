name: quality

# The gate is the pull request into main, and nowhere else.
#
# `dev` is where work lands quickly, so nothing heavy runs on a push there. The
# integration suite launches real processes and talks to the real libproc, so it
# has to run on macOS; Linux runs the same suite against the fake sources and is
# the fast sanity check. Docker is out of reach of GitHub's macOS runners, so
# that gap is covered by the simulated container source plus
# `tools/docker-checks.sh`, run by hand on the maintainer's Mac before a release
# (docs/PRUEBAS.md, section 3).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the Rust toolchain
        run: python scripts/install-rust-toolchain.py

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.os }}

      # The menu-bar shell is macOS-only (ADR-016); Linux would need WebKitGTK to
      # compile it, so only the macOS leg builds, lints and tests it.
      - run: cargo fmt --all --check

      - name: Every test of PRUEBAS.md exists
        run: python3 tools/check_matrix.py

      - name: Lint and test (Linux, without the macOS shell)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo clippy --workspace --exclude devports-app --all-targets -- -D warnings
          cargo test --workspace --exclude devports-app

      - name: Interface (macOS leg: it is embedded in the app)
        if: matrix.os == 'macos-latest'
        run: |
          corepack enable
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui run typecheck
          pnpm --dir ui run lint
          pnpm --dir ui run format:check
          pnpm --dir ui run test
          pnpm --dir ui run build

      - name: Lint and test (macOS, whole workspace)
        if: matrix.os == 'macos-latest'
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the Rust toolchain
        run: python scripts/install-rust-toolchain.py

      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: rust-security-tools-${{ runner.os }}-deny-0.20.2

      - name: Install cargo-deny
        run: |
          if ! cargo deny --version | grep -Fq 'cargo-deny 0.20.2'; then
            cargo install --locked --force cargo-deny --version 0.20.2
          fi

      # Licenses, bans, sources and RustSec advisories, evaluated for the macOS
      # dependency graph only (deny.toml). `cargo audit` is not run on top of it:
      # it reads the whole Cargo.lock, including the Linux-only GTK crates that
      # Tauri adds and that this project never builds, and would report them.
      - name: Check dependency policy and advisories
        run: cargo deny check
